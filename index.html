<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IADE eat's ?</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
    h1 { text-align: center; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background-color: #2c3e50; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
    .badge { padding: 4px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; color: white; display: inline-block; }
    .badge-besoin { background-color: #e67e22; }
    .badge-effectue { background-color: #27ae60; }
    .badge-pause { background-color: #17a2b8; }
  </style>
</head>
<body>

  <h1>IADE eat's ?</h1>

  <table>
    <thead>
      <tr>
        <th>Secteurs</th>
        <th>Salles</th>
        <th>Café matin ☕</th>
        <th>Remp. Café</th>
        <th>Déjeuner 🥪</th>
        <th>Remp. Déj</th>
        <th>Café PM ☕</th>
        <th>Remp. PM</th>
        <th>Relais Plein 🛒</th>
        <th>Remp. Plein</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- Les lignes sont générées dynamiquement -->
    </tbody>
  </table>

  <script>
    // URL DE TON DEPLOIEMENT GOOGLE APPS SCRIPT
    const API_URL = "TON_URL_APP_SCRIPT_ICI";

    // Liste des salles
    const rooms = [
      { sector: "Urgences 🚨", room: "S1" },
      { sector: "Urgences 🚨", room: "S2" },
      { sector: "Neurochir 🧠", room: "S3" },
      { sector: "Neurochir 🧠", room: "S4" },
      { sector: "Neurochir 🧠", room: "S5" },
      { sector: "Ophtalmo 👁️", room: "S6" },
      { sector: "Ophtalmo 👁️", room: "S7" },
      { sector: "Uro 🚽", room: "S8" },
      { sector: "Uro 🚽", room: "S9" },
      { sector: "Traumato 🔨", room: "S10" },
      { sector: "Ortho 🦴", room: "S11" },
      { sector: "Ortho 🦴", room: "S12" },
      { sector: "Ortho 🦴", room: "S13" },
      { sector: "Ortho 🦴", room: "S14" },
      { sector: "Traumato 🔨", room: "S15" },
      { sector: "Rép 🥩", room: "S17" },
      { sector: "Rép 🥩", room: "S18" },
      { sector: "Rép 🥩", room: "S19" },
      { sector: "Uro 🚽", room: "S20" },
      { sector: "Cardio 🫀", room: "S21" },
      { sector: "Cardio 🫀", room: "S22" },
      { sector: "Vasculaire 🩸", room: "S23" },
      { sector: "Vasculaire 🩸", room: "S24" },
      { sector: "Vasculaire 🩸", room: "S25" },
      { sector: "Thorax 🫁", room: "S26" },
      { sector: "Thorax 🫁", room: "S27" },
      { sector: "Thorax 🫁", room: "S28" },
      { sector: "SSPI Nord-Nord 🏥", room: "SSPI Nord-Nord" },
      { sector: "NRI ☣️", room: "SBiplan" },
      { sector: "NRI ☣️", room: "SMonoplan" },
      { sector: "NRI ☣️", room: "STDM" }
    ];

    const pauseTypes = ["Café matin", "Déjeuner", "Café PM", "Relais Plein"];

    // Options du menu déroulant des remplacements
    const rempOptions = ["", "remplacement à effectuer 👍", "relais effectué 👍"];

    function initTable() {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      rooms.forEach(item => {
        const tr = document.createElement("tr");

        // Secteur & Salle
        tr.innerHTML = `<td>${item.sector}</td><td><strong>${item.room}</strong></td>`;

        // Génération des colonnes de Pause + Remplacement
        pauseTypes.forEach(pType => {
          // Colonne Statut Pause
          const pauseCellId = `status-${item.room}-${pType.replace(/\s+/g, '')}`;
          tr.innerHTML += `<td id="${pauseCellId}">-</td>`;

          // Colonne Menu Déroulant Remplacement
          const rempSelectId = `remp-${item.room}-${pType.replace(/\s+/g, '')}`;
          let selectHTML = `<select id="${rempSelectId}" onchange="updateRemplacement('${item.room}', '${pType}', this.value)">`;
          rempOptions.forEach(opt => {
            selectHTML += `<option value="${opt}">${opt}</option>`;
          });
          selectHTML += `</select>`;

          tr.innerHTML += `<td>${selectHTML}</td>`;
        });

        tbody.appendChild(tr);
      });
    }

    // Récupère les données de Google Sheets
    async function loadData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        data.forEach(entry => {
          if (!entry.room || !entry.pauseType) return;

          const cleanType = entry.pauseType.replace("Remp ", "").replace(/\s+/g, '');

          if (entry.pauseType.startsWith("Remp ")) {
            // Mise à jour du menu déroulant de remplacement
            const selectEl = document.getElementById(`remp-${entry.room}-${cleanType}`);
            if (selectEl && selectEl.value !== entry.status) {
              selectEl.value = entry.status;
            }
          } else {
            // Mise à jour de l'affichage du badge de pause
            const cellEl = document.getElementById(`status-${entry.room}-${cleanType}`);
            if (cellEl) {
              cellEl.innerHTML = formatStatusBadge(entry.status);
            }
          }
        });
      } catch (err) {
        console.error("Erreur de chargement des données :", err);
      }
    }

    // Envoie la modification de remplacement à Google Sheets
    async function updateRemplacement(room, pauseType, value) {
      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            room: room,
            pauseType: "Remp " + pauseType,
            status: value
          })
        });
      } catch (err) {
        console.error("Erreur lors de l'envoi du remplacement :", err);
      }
    }

    function formatStatusBadge(status) {
      if (!status) return "-";
      let lower = status.toLowerCase();
      if (lower.includes("besoin")) return `<span class="badge badge-besoin">${status}</span>`;
      if (lower.includes("effectu")) return `<span class="badge badge-effectue">${status}</span>`;
      if (lower.includes("pause")) return `<span class="badge badge-pause">${status}</span>`;
      return status;
    }

    // Initialisation
    initTable();
    loadData();

    // Synchronisation automatique toutes les 10 secondes sur tous les écrans
    setInterval(loadData, 10000);
  </script>
</body>
</html>
